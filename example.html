<div class="font-manager-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Font Manager 🎨</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div>
                <input id="font_manager_enabled" type="checkbox" />
                <label for="font_manager_enabled">Enable Font Manager</label>
            </div>

            <hr>

            <div class="flex-container flexFlowColumn gap-10">
                <label for="font_manager_url">Font URL:</label>
                <input id="font_manager_url" type="text" class="text_pole" placeholder="https://fonts.googleapis.com/..." />

                <label for="font_manager_family">Font Family:</label>
                <input id="font_manager_family" type="text" class="text_pole" placeholder="e.g. 'Sarabun', sans-serif" />

                <!-- ✨ [NEW] เปลี่ยนปุ่มเป็นปุ่มบันทึก -->
                <input id="font_manager_save_btn" class="menu_button" type="submit" value="💾 Save Font to List" />
            </div>

            <hr>

            <!-- ✨ [NEW] พื้นที่สำหรับแสดงผล "การ์ด" ที่ถูกบันทึก -->
            <div class="flex-container flexFlowColumn gap-10">
                <label><b>Saved Fonts 📚</b></label>
                <div id="font_manager_saved_cards">
                    <!-- การ์ดจะถูกสร้างและนำมาวางตรงนี้ด้วย JavaScript ค่ะ -->
                </div>
            </div>

            <hr>

            <div class="flex-container flexFlowColumn gap-10">
                <label>Font Size (ขนาดฟอนต์): <span id="font_manager_size_display">16px</span></label>
                <input id="font_manager_size_slider" type="range" min="10" max="30" step="1" value="16" />
            </div>

        </div>
    </div>
</div>
